[project]
name = "mt5-ai-scalper"
version = "0.1.0"
description = "Plataforma modular para pesquisa, simulacao e execucao controlada de estrategias de scalping no MetaTrader 5."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",
    "cryptography>=43.0",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "shap>=0.45",
    "joblib>=1.4",
    # Cliente HTTP para integracoes externas (Fase 18.6 — provedor real de
    # noticias/fundamentos, quando implementado). Ja era dependencia de teste
    # (TestClient do FastAPI); promovida para dependencia principal aqui
    # porque codigo de aplicacao (nao so teste) agora tem um motivo concreto
    # para chamar uma API externa.
    "httpx>=0.27",
    # Cliente Linux da ponte RPyC exposta pelo container MT5 externo.
    # Estas versoes precisam coincidir com o servidor executado no Wine.
    "mt5linux==1.0.3",
    "rpyc==5.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "aiosqlite>=0.20",
]
# O pacote MetaTrader5 so publica wheel para Windows (envolve o terminal via
# DLL/named pipe) -- nao instala em Linux/macOS, logo nao pode ser dependencia
# obrigatoria (quebraria `pip install .` em qualquer imagem Docker). Extra
# separado, instalado so no host Windows que roda o terminal MT5 de verdade.
# `app/mt5/connection.py` importa `MetaTrader5` de forma tardia (dentro da
# funcao, nao no topo do modulo) exatamente para isolar esse requisito --
# unica camada do sistema que precisa deste extra.
mt5 = [
    "MetaTrader5>=5.0.45",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# E501: line length ja controlado pelo Black.
# B008: `Depends(...)` como valor padrao de parametro e o padrao idiomatico
# do FastAPI para injecao de dependencia, nao uma mutable-default real.
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
