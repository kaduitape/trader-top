services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-CHANGE_ME_root}
      MYSQL_DATABASE: ${DB_NAME:-mt5_ai_scalper}
      MYSQL_USER: ${DB_USER:-scalper}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # O worker MT5 roda no mesmo Windows e acessa esta porta pelo host.
      # Nao publique o banco na rede local/Internet.
      - "127.0.0.1:${DB_EXPOSED_PORT:-3306}:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?defina APP_SECRET_KEY no .env}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      SYSTEM_MODE: DISABLED
      DASHBOARD_AUTH_DISABLED: ${DASHBOARD_AUTH_DISABLED:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      DB_DRIVER: mysql+pymysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mt5_ai_scalper}
      DB_USER: ${DB_USER:-scalper}
      DB_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_POOL_MAX_OVERFLOW: ${DB_POOL_MAX_OVERFLOW:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      ML_DATASETS_DIR: /app/datasets
      ML_MODELS_DIR: /app/models
      QUALITY_MAX_SPREAD_POINTS: ${QUALITY_MAX_SPREAD_POINTS:-50.0}
      QUALITY_MAX_FEED_DELAY_SECONDS: ${QUALITY_MAX_FEED_DELAY_SECONDS:-300}
      ANALYSIS_DEFAULT_TIMEFRAME: ${ANALYSIS_DEFAULT_TIMEFRAME:-M15}
      ANALYSIS_DEFAULT_THRESHOLD: ${ANALYSIS_DEFAULT_THRESHOLD:-90.0}
      AISA_API_KEY: ${AISA_API_KEY:-}
      AISA_API_BASE_URL: ${AISA_API_BASE_URL:-}
      RUN_PREFLIGHT: ${RUN_PREFLIGHT:-true}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./datasets:/app/datasets
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 20s

volumes:
  mysql_data:
